dataset_config:
  tokenizer_type: "FinLMTokenizer"
  tokenizer_path: "/data/language_models/tokenizers/finlm-bpe-encoder-tokenizer.json"
  max_sequence_length: 512
  db_name: "/data/finlm_sequences/finlm_chunks_450.sqlite"
  batch_size: 32
  database_retrieval:
    form_tenk:
      limit: 250000
      offset: 0
    form_eightk:
      limit: 250000
      offset: 0
    earning_calls:
      limit: 250000
      offset: 0
    tr_news: 
      limit: 250000
      offset: 0 
    esg_reports:
      limit: 150000
      offset: 0
    ssrn_papers:
      limit: 68000
model_config:
  embedding_size: 256
  hidden_size: 512
  num_hidden_layers: 12
  num_attention_heads: 8
  intermediate_size: 2048
  max_position_embeddings: 512
optimization_config:
  learning_rate: 0.0001
  n_epochs: 20
  lr_scheduler_warm_up_steps: 10000
  mlm_probability: 0.15
  use_gradient_clipping: True
  