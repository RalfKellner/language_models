dataset_config:
  tokenizer_type: "FinLMTokenizer"
  tokenizer_path: "/data/language_models/tokenizers/finlm-bpe-encoder-tokenizer.json"
  max_sequence_length: 512
  db_name: "/data/finlm_sequences/finlm_chunks_450.sqlite"
  batch_size: 64
  database_retrieval:
    form_tenk:
      limit: 512
      offset: 0
    form_eightk:
      limit: 512
      offset: 0
    earning_calls:
      limit: 512
      offset: 0
    tr_news: 
      limit: 512
      offset: 0
    esg_reports:
      limit: 512
      offset: 0
    ssrn_papers:
      limit: 512
      offset: 0
model_config:
  embedding_size: 64
  hidden_size: 128
  num_hidden_layers: 6
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512
  generator_size: 0.25
  generator_layer_size: 1.0
optimization_config:
  learning_rate: 0.0001
  n_epochs: 3
  lr_scheduler_warm_up_steps: 0
  mlm_probability: 0.15
  use_gradient_clipping: True
  discriminator_weight: 50
  discriminator_sampling: "gumbel_softmax"